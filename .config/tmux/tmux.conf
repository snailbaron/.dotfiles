set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -ag terminal-features ",*:hyperlinks"
set -g focus-events on

set-option -g escape-time 1
set-option -g history-limit 10000
set-option -g mode-keys vi

set-window-option -g xterm-keys on  # send xterm escape sequences

# A ~/.ssh/ssh_auto_sock symlink is created on remote host upon each ssh
# connection (see ~/.ssh/rc). It points to the up-to-date ssh-agent socket. If
# this symlink exists, use it as SSH_AUTH_SOCK. Do not update SSH_AUTH_SOCK
# from external environment.
if-shell "test -e ~/.ssh/ssh_auth_sock" {
    set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock
    set-option -g update-environment []
}

#
# Vim interop
#

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
#
# Two deviations from the upstream docs, both deliberate:
#
#   1. Upstream holds the whole condition in a tmux environment variable
#      ("is_vim=..."), which tmux then exports to every pane's shell. The value
#      ends in "$'", which breaks tools that inline the environment into
#      generated code (it makes prettier's parallel worker pool hang forever).
#      A user option is not exported, so only the regex is kept here.
#
#   2. The ps/grep condition is written inline in each binding rather than
#      stored in the option. Format expansion is single-pass, so a "#{pane_tty}"
#      nested inside a "#{@option}" value would NOT be expanded -- the option
#      must not contain any format itself.
set -g @is_vim_re '^[^TXZ ]+ +(\S+/)?g?(view|n?vim?x?)(diff)?$'

# Condition, for reference (kept inline below, see note 2):
#   ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'

# Move to pane (root key table, no prefix needed)
bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys C-l" "select-pane -R"

# Move to pane (copy-mode table, when in copy mode)
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Resize current pane
bind-key -n M-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys Escape h" "resize-pane -L 5"
bind-key -n M-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys Escape j" "resize-pane -D 3"
bind-key -n M-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys Escape k" "resize-pane -U 3"
bind-key -n M-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '#{@is_vim_re}'" "send-keys Escape l" "resize-pane -R 5"
